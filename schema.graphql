schema {
  query: Query
  mutation: Mutation
}

type Query {
  health: HealthReport! @cost(weight: "10")
  myVehicles(search: String, skip: Int! = 0, take: Int! = 50): [Vehicle!]!
    @cost(weight: "10")
  myVehicleCount(search: String): Int! @cost(weight: "10")
  vehicles(
    orderBy: VehicleSortField! = NAME
    direction: SortDirection! = ASC
    skip: Int! = 0
    take: Int! = 50
  ): [Vehicle!]! @cost(weight: "10")
  vehicleCount: Int! @cost(weight: "10")
  trash(
    orderBy: VehicleSortField! = DELETED_AT
    direction: SortDirection! = DESC
    skip: Int! = 0
    take: Int! = 50
  ): [Vehicle!]! @cost(weight: "10")
  trashCount: Int! @cost(weight: "10")
  trashDeletableCount: Int! @cost(weight: "10")
  vehicleDefaults: VehicleDefaults!
  vehicle(id: UUID!): Vehicle @cost(weight: "10")
  session: Session! @cost(weight: "10")
  notices: [Notice!]!
  users: [UserAccount!]! @cost(weight: "10")
  canSetUserPasswords: Boolean! @cost(weight: "10")
  accessSettings: AccessSettingsInfo! @cost(weight: "10")
  accessGrants: [AccessGrantInfo!]! @cost(weight: "10")
  mySessions: [UserSessionInfo!]! @cost(weight: "10")
  refuelings(
    vehicleId: UUID!
    orderBy: RefuelingSortField! = DATE
    direction: SortDirection! = DESC
    skip: Int! = 0
    take: Int! = 50
  ): [Refueling!]! @cost(weight: "10")
  refuelingCount(vehicleId: UUID!): Int! @cost(weight: "10")
  refueling(id: UUID!): Refueling @cost(weight: "10")
  logDefaults(vehicleId: UUID!): LogDefaults @cost(weight: "10")
  refuelingTrash(
    orderBy: RefuelingSortField! = DELETED_AT
    direction: SortDirection! = DESC
    skip: Int! = 0
    take: Int! = 50
  ): [Refueling!]! @cost(weight: "10")
  refuelingTrashCount: Int! @cost(weight: "10")
  refuelingTrashDeletableCount: Int! @cost(weight: "10")
  vehicleLogAccess(vehicleId: UUID!): [LogAccessGrantInfo!]! @cost(weight: "10")
  shareCandidates(vehicleId: UUID!): [UserRef!]! @cost(weight: "10")
  expenses(
    vehicleId: UUID!
    orderBy: ExpenseSortField! = DATE
    direction: SortDirection! = DESC
    skip: Int! = 0
    take: Int! = 50
  ): [Expense!]! @cost(weight: "10")
  expenseCount(vehicleId: UUID!): Int! @cost(weight: "10")
  expense(id: UUID!): Expense @cost(weight: "10")
  expenseCategories(vehicleId: UUID!): [String!]! @cost(weight: "10")
  expenseTrash(
    orderBy: ExpenseSortField! = DELETED_AT
    direction: SortDirection! = DESC
    skip: Int! = 0
    take: Int! = 50
  ): [Expense!]! @cost(weight: "10")
  expenseTrashCount: Int! @cost(weight: "10")
  expenseTrashDeletableCount: Int! @cost(weight: "10")
  notifications(unreadOnly: Boolean! = false, skip: Int! = 0, take: Int! = 20): [NotificationInfo!]!
    @cost(weight: "10")
  notificationCount(unreadOnly: Boolean! = false): Int! @cost(weight: "10")
  recognitionStatus: RecognitionStatusInfo! @cost(weight: "10")
  photoDrafts(ids: [UUID!]!): [PhotoDraftInfo!]! @cost(weight: "10")
  importPreview(token: String!, vehicleId: UUID): ImportPreviewInfo!
    @cost(weight: "10")
  importFormats: [String!]!
  vehicleChartData(vehicleId: UUID!, config: ChartConfigInput!): ChartData!
    @cost(weight: "10")
  vehicleCharts(vehicleId: UUID!): [VehicleChart!]! @cost(weight: "10")
  uiSettings: UiSettingsInfo! @cost(weight: "10")
}

type Mutation {
  addVehicle(input: AddVehicleInput!): Vehicle! @cost(weight: "10")
  updateVehicle(input: UpdateVehicleInput!): Vehicle! @cost(weight: "10")
  deleteVehicle(id: UUID!): Vehicle! @cost(weight: "10")
  restoreVehicle(id: UUID!): Vehicle! @cost(weight: "10")
  emptyTrash: Int! @cost(weight: "10")
  login(input: LoginInput!): UserInfo! @cost(weight: "10")
  logout: Boolean! @cost(weight: "10")
  changePassword(input: ChangePasswordInput!): Boolean! @cost(weight: "10")
  requestPasswordReset(email: String!): Boolean! @cost(weight: "10")
  resetPassword(input: ResetPasswordInput!): Boolean! @cost(weight: "10")
  createUser(input: CreateUserInput!): CreatedUser! @cost(weight: "10")
  issuePasswordReset(userId: UUID!): PasswordResetLink! @cost(weight: "10")
  setUserAdmin(userId: UUID!, isAdmin: Boolean!): UserAccount!
    @cost(weight: "10")
  setUserDisabled(userId: UUID!, disabled: Boolean!): UserAccount!
    @cost(weight: "10")
  updateUser(input: UpdateUserInput!): UserAccount! @cost(weight: "10")
  setUserPassword(userId: UUID!, newPassword: String!): Boolean!
    @cost(weight: "10")
  deleteUser(input: DeleteUserInput!): Boolean! @cost(weight: "10")
  setDefaultAccess(level: AccessLevel!): AccessSettingsInfo! @cost(weight: "10")
  setAccessGrant(input: SetAccessGrantInput!): Boolean! @cost(weight: "10")
  revokeSession(id: UUID!): Boolean! @cost(weight: "10")
  revokeOtherSessions: Int! @cost(weight: "10")
  logRefueling(input: LogRefuelingInput!): Refueling! @cost(weight: "10")
  updateRefueling(input: UpdateRefuelingInput!): Refueling! @cost(weight: "10")
  deleteRefueling(id: UUID!): Refueling! @cost(weight: "10")
  restoreRefueling(id: UUID!): Refueling! @cost(weight: "10")
  emptyRefuelingTrash: Int! @cost(weight: "10")
  setVehicleLogAccess(input: SetLogAccessInput!): Boolean! @cost(weight: "10")
  addExpense(input: AddExpenseInput!): Expense! @cost(weight: "10")
  updateExpense(input: UpdateExpenseInput!): Expense! @cost(weight: "10")
  deleteExpense(id: UUID!): Expense! @cost(weight: "10")
  restoreExpense(id: UUID!): Expense! @cost(weight: "10")
  emptyExpenseTrash: Int! @cost(weight: "10")
  addRecurringExpense(input: AddRecurringExpenseInput!): RecurringExpenseInfo!
    @cost(weight: "10")
  updateRecurringExpense(input: UpdateRecurringExpenseInput!): RecurringExpenseInfo!
    @cost(weight: "10")
  deleteRecurringExpense(id: UUID!): Boolean! @cost(weight: "10")
  markRecurringExpensesDone(input: MarkRecurringExpensesDoneInput!): MarkRecurringExpensesDonePayload!
    @cost(weight: "10")
  markNotificationsRead(ids: [UUID!]): [NotificationInfo!]! @cost(weight: "10")
  confirmImport(input: ConfirmImportInput!): ImportResultInfo!
    @cost(weight: "10")
  saveVehicleChart(input: SaveChartInput!): VehicleChart! @cost(weight: "10")
  deleteVehicleChart(id: UUID!): Boolean! @cost(weight: "10")
  updateUiSettings(input: UpdateUiSettingsInput!): UiSettingsInfo!
    @cost(weight: "10")
  saveGridSettings(input: GridSettingsInput!): GridSettingsInfo!
    @cost(weight: "10")
  resetGridSettings(gridId: String!): Boolean! @cost(weight: "10")
  setVehicleOrder(vehicleIds: [UUID!]!): Boolean! @cost(weight: "10")
}

type AccessGrantInfo {
  id: UUID!
  ownerId: UUID!
  granteeId: UUID!
  level: AccessLevel!
}

type AccessSettingsInfo {
  defaultLevelForOthers: AccessLevel!
}

type ChartData {
  unit: ChartUnit!
  series: [ChartSeries!]!
}

type ChartPoint {
  key: String!
  value: Decimal
}

type ChartSeries {
  kind: String!
  currency: String
  points: [ChartPoint!]!
}

type CreatedUser {
  user: UserAccount!
  reset: PasswordResetLink!
}

type CurrencySpend {
  currency: String!
  thisMonth: Decimal!
  lastMonth: Decimal!
}

type Expense {
  "The values its photos filled in that nobody has checked yet."
  filledFromPhoto: [LogValue!]! @cost(weight: "10")
  id: UUID!
  ownerId: UUID!
  vehicleId: UUID!
  createdById: UUID!
  date: LocalDate!
  title: String!
  category: String
  note: String
  amount: Decimal
  currency: String
  odometer: Long
  deletedAt: DateTime
  reviewState: ReviewState!
  version: Int!
  canEdit: Boolean! @cost(weight: "10")
  canDelete: Boolean! @cost(weight: "10")
  createdBy: UserRef @cost(weight: "10")
  vehicle: Vehicle @cost(weight: "10")
  photos: [LogPhotoInfo!]! @cost(weight: "10")
  schedules: [RecurringRef!]! @cost(weight: "10")
}

type GridSettingsInfo {
  gridId: String!
  order: [String!]!
  hidden: [String!]!
  pageSize: Int!
  sortColumn: String!
  sortDirection: SortDirection!
}

type HealthReport {
  status: String!
  version: String!
  uptime: Duration!
  databaseReachable: Boolean!
}

type ImportedVehicleInfo {
  name: String
  licensePlate: String
  fuelType: FuelType
  distanceUnit: DistanceUnit
  volumeUnit: VolumeUnit
}

type ImportIssueInfo {
  section: String!
  row: Int!
  key: String!
  args: Any!
}

type ImportPreviewInfo {
  sourceVehicle: ImportedVehicleInfo
  fuelRows: Int!
  expenseRows: Int!
  recurringRows: Int!
  duplicateFuelRows: Int!
  duplicateExpenseRows: Int!
  duplicateRecurringRows: Int!
  firstDate: LocalDate
  lastDate: LocalDate
  categories: [String!]!
  issues: [ImportIssueInfo!]!
}

type ImportResultInfo {
  vehicleId: UUID!
  fuelImported: Int!
  expensesImported: Int!
  recurringImported: Int!
  fuelSkippedDuplicates: Int!
  expensesSkippedDuplicates: Int!
  recurringSkippedDuplicates: Int!
  errors: [ImportIssueInfo!]!
}

type LogAccessGrantInfo {
  user: UserRef!
  level: AccessLevel!
}

type LogDefaults {
  lastOdometer: Long
  lastDate: LocalDate
  currency: String!
}

type LogPhotoInfo {
  id: UUID!
  url: String!
  reading: PhotoReadingInfo @cost(weight: "10")
}

type MarkRecurringExpensesDonePayload {
  schedules: [RecurringExpenseInfo!]!
  expense: Expense
}

type MeasurementUnits {
  distance: DistanceUnit!
  volume: VolumeUnit!
}

type MonthAmount {
  month: String!
  amount: Decimal!
}

type Notice {
  code: String!
  severity: NoticeSeverity!
  message: String!
}

type NotificationArg {
  name: String!
  value: String!
}

type NotificationInfo {
  id: UUID!
  kind: NotificationKind!
  createdAt: DateTime!
  updatedAt: DateTime!
  read: Boolean!
  readAt: DateTime
  count: Int!
  subject: NotificationRefInfo!
  context: NotificationRefInfo
  args: [NotificationArg!]!
}

type NotificationRefInfo {
  type: NotificationEntityType!
  id: UUID!
}

type PasswordResetLink {
  token: String!
  url: String
  emailSent: Boolean!
}

type PhotoDraftInfo {
  id: UUID!
  url: String!
  reading: PhotoReadingInfo
}

type PhotoReadingInfo {
  status: ReadingStatus!
  kind: DocumentKind
  values: [ReadingValueInfo!]!
  issues: [ReadingIssueInfo!]!
}

type ReadingIssueInfo {
  code: ReadingIssueCode!
  field: ReadingFieldName
}

type ReadingValueInfo {
  name: ReadingFieldName!
  value: String!
  confidence: Float!
}

type RecognitionStatusInfo {
  available: Boolean!
}

type RecurrenceStatusInfo {
  state: RecurrenceState!
  limit: RecurrenceLimit
  dueDate: LocalDate
  dueOdometer: Long
  daysLeft: Int
  distanceLeft: Long
}

type RecurringExpenseInfo {
  id: UUID!
  vehicleId: UUID!
  title: String!
  category: String
  note: String
  kind: RecurrenceKind!
  intervalMonths: Int
  intervalDistance: Long
  lastDoneDate: LocalDate!
  lastDoneOdometer: Long
  warnDays: Int!
  warnDistance: Long!
  createdAt: DateTime!
  version: Int!
  status: RecurrenceStatusInfo!
}

type RecurringRef {
  id: UUID!
  title: String!
}

type Refueling {
  "The values its photos filled in that nobody has checked yet."
  filledFromPhoto: [LogValue!]! @cost(weight: "10")
  id: UUID!
  ownerId: UUID!
  vehicleId: UUID!
  createdById: UUID!
  date: LocalDate!
  volume: Decimal
  totalCost: Decimal
  currency: String
  isFullTank: Boolean!
  missedPreviousFillUp: Boolean!
  note: String
  odometer: Long
  consumption: Decimal
  reviewState: ReviewState!
  deletedAt: DateTime
  pricePerUnit: Decimal
  version: Int!
  canEdit: Boolean! @cost(weight: "10")
  canDelete: Boolean! @cost(weight: "10")
  createdBy: UserRef @cost(weight: "10")
  vehicle: Vehicle @cost(weight: "10")
  photos: [LogPhotoInfo!]! @cost(weight: "10")
}

type Session {
  mode: AuthMode!
  user: UserInfo
}

type UiSettingsInfo {
  navOpen: Boolean
  language: String
  colorMode: ColorMode
  grids: [GridSettingsInfo!]! @cost(weight: "10")
}

type UserAccount {
  id: UUID!
  provider: UserProvider!
  email: String!
  displayName: String!
  isAdmin: Boolean!
  isDisabled: Boolean!
  avatarUrl: String
}

type UserInfo {
  id: UUID!
  displayName: String!
  email: String!
  isAdmin: Boolean!
  avatarUrl: String
}

type UserRef {
  id: UUID!
  displayName: String!
  avatarUrl: String
}

type UserSessionInfo {
  id: UUID!
  client: String
  createdAt: DateTime!
  lastUsedAt: DateTime!
  expiresAt: DateTime!
  current: Boolean!
}

type Vehicle {
  id: UUID!
  ownerId: UUID!
  name: String!
  licensePlate: String
  fuelType: FuelType!
  units: MeasurementUnits!
  deletedAt: DateTime
  isDeleted: Boolean!
  version: Int!
  canEdit: Boolean! @cost(weight: "10")
  logAccess: AccessLevel! @cost(weight: "10")
  owner: UserRef @cost(weight: "10")
  pictureUrl: String
  refuelingCount: Int! @cost(weight: "10")
  expenseCount: Int! @cost(weight: "10")
  recurring: [RecurringExpenseInfo!]! @cost(weight: "10")
  summary: VehicleSummary @cost(weight: "10")
}

type VehicleChart {
  id: UUID!
  vehicleId: UUID!
  title: String!
  metric: ChartMetric!
  grouping: ChartGrouping!
  kind: ChartKind!
  range: ChartRange!
  stacked: Boolean!
  rangeFrom: LocalDate
  rangeTo: LocalDate
  isShared: Boolean!
  createdAt: DateTime!
  canEdit: Boolean! @cost(weight: "10")
  createdBy: UserRef @cost(weight: "10")
}

type VehicleDefaults {
  distanceUnit: DistanceUnit!
  volumeUnit: VolumeUnit!
  currency: String!
  recurringWarnDays: Int!
  recurringWarnDistance: Long!
}

type VehicleSummary {
  lastFillUpDate: LocalDate
  latestOdometer: Long
  averageConsumption: Decimal
  currency: String
  thisMonthSpend: Decimal!
  lastMonthSpend: Decimal!
  spendTrend: [MonthAmount!]!
  fillUpCount: Int!
  expenseCount: Int!
  spending: [CurrencySpend!]!
}

input AddExpenseInput {
  vehicleId: UUID!
  date: LocalDate!
  title: String!
  category: String
  amount: Decimal
  currency: String
  odometer: Long
  note: String
  photoIds: [UUID!]
  id: UUID
}

input AddRecurringExpenseInput {
  vehicleId: UUID!
  title: String!
  category: String
  note: String
  kind: RecurrenceKind!
  intervalMonths: Int
  intervalDistance: Long
  lastDoneDate: LocalDate
  lastDoneOdometer: Long
  warnDays: Int
  warnDistance: Long
  id: UUID
}

input AddVehicleInput {
  name: String!
  licensePlate: String
  fuelType: FuelType!
  units: MeasurementUnitsInput
  id: UUID
}

input ChangePasswordInput {
  currentPassword: String!
  newPassword: String!
}

input ChartConfigInput {
  metric: ChartMetric!
  grouping: ChartGrouping!
  kind: ChartKind!
  range: ChartRange!
  stacked: Boolean!
  from: LocalDate
  to: LocalDate
}

input ConfirmImportInput {
  token: String!
  vehicleId: UUID
  newVehicle: NewVehicleInput
  currency: String
  importDuplicates: Boolean!
}

input CreateUserInput {
  email: String!
  displayName: String
  isAdmin: Boolean!
}

input DeleteUserInput {
  userId: UUID!
  data: UserDataDisposition
  moveToUserId: UUID
}

input GridSettingsInput {
  gridId: String!
  order: [String!]!
  hidden: [String!]!
  pageSize: Int!
  sortColumn: String!
  sortDirection: SortDirection!
}

input LoginInput {
  email: String!
  password: String!
}

input LogRefuelingInput {
  vehicleId: UUID!
  date: LocalDate!
  volume: Decimal
  totalCost: Decimal
  currency: String
  odometer: Long
  isFullTank: Boolean!
  note: String
  photoIds: [UUID!]
  missedPreviousFillUp: Boolean
  id: UUID
}

input MarkRecurringExpensesDoneInput {
  ids: [UUID!]!
  date: LocalDate!
  odometer: Long
  amount: Decimal
  currency: String
  title: String
  category: String
  photoIds: [UUID!]
  expenseId: UUID
}

input MeasurementUnitsInput {
  distance: DistanceUnit!
  volume: VolumeUnit!
}

input NewVehicleInput {
  name: String!
  licensePlate: String
  fuelType: FuelType!
  units: MeasurementUnitsInput!
}

input ResetPasswordInput {
  token: String!
  newPassword: String!
}

input SaveChartInput {
  id: UUID
  vehicleId: UUID!
  title: String!
  config: ChartConfigInput!
  shared: Boolean!
}

input SetAccessGrantInput {
  ownerId: UUID!
  granteeId: UUID!
  level: AccessLevel!
}

input SetLogAccessInput {
  vehicleId: UUID!
  userId: UUID!
  level: AccessLevel!
}

input UpdateExpenseInput {
  id: UUID!
  date: LocalDate!
  title: String!
  category: String
  amount: Decimal
  currency: String
  odometer: Long
  note: String
}

input UpdateRecurringExpenseInput {
  id: UUID!
  title: String!
  category: String
  note: String
  kind: RecurrenceKind!
  intervalMonths: Int
  intervalDistance: Long
  lastDoneDate: LocalDate!
  lastDoneOdometer: Long
  warnDays: Int
  warnDistance: Long
}

input UpdateRefuelingInput {
  id: UUID!
  date: LocalDate!
  volume: Decimal
  totalCost: Decimal
  currency: String
  odometer: Long
  isFullTank: Boolean!
  note: String
  missedPreviousFillUp: Boolean
}

input UpdateUiSettingsInput {
  navOpen: Boolean
  language: String
  clearLanguage: Boolean
  colorMode: ColorMode
}

input UpdateUserInput {
  userId: UUID!
  email: String!
  displayName: String
}

input UpdateVehicleInput {
  id: UUID!
  name: String!
  licensePlate: String
  fuelType: FuelType!
  units: MeasurementUnitsInput
}

enum AccessLevel {
  NONE
  VIEW
  EDIT
  DELETE
}

enum AuthMode {
  NONE
  STANDALONE
  OIDC
  PROXY_HEADER
}

enum ChartGrouping {
  MONTH
  QUARTER
  YEAR
  CATEGORY
}

enum ChartKind {
  BAR
  LINE
  AREA
  DONUT
}

enum ChartMetric {
  TOTAL_SPEND
  FUEL_COST
  EXPENSE_COST
  FUEL_VOLUME
  DISTANCE
  AVERAGE_CONSUMPTION
  AVERAGE_PRICE_PER_UNIT
  FILL_UPS
}

enum ChartRange {
  LAST1_MONTH
  LAST3_MONTHS
  LAST6_MONTHS
  LAST12_MONTHS
  THIS_YEAR
  LAST_YEAR
  ALL
  CUSTOM
}

enum ChartUnit {
  CURRENCY
  VOLUME
  DISTANCE
  CONSUMPTION
  COUNT
}

enum ColorMode {
  LIGHT
  DARK
  SYSTEM
}

enum DistanceUnit {
  KILOMETERS
  MILES
}

enum DocumentKind {
  ODOMETER
  FUEL_RECEIPT
  EXPENSE_RECEIPT
  UNKNOWN
}

enum ExpenseSortField {
  DATE
  TITLE
  CATEGORY
  AMOUNT
  ODOMETER
  CREATED_BY
  VEHICLE
  DELETED_AT
}

enum FuelType {
  PETROL
  DIESEL
  LPG
}

enum LogValue {
  ODOMETER
  VOLUME
  TOTAL
}

enum NoticeSeverity {
  INFO
  WARNING
}

enum NotificationEntityType {
  INSTANCE
  VEHICLE
  RECURRING_EXPENSE
  USER
  REFUELING
  EXPENSE
}

enum NotificationKind {
  LOG_ACCESS_CHANGED
  VEHICLE_SHARED
  DATA_ACCESS_CHANGED
  DATA_SHARED
  DEFAULT_ACCESS_CHANGED
  RECURRING_DUE_SOON
  RECURRING_OVERDUE
  LOG_FILLED_FROM_PHOTO
  LOG_NOT_FILLED
  MORE_ACTIVITY
}

enum ReadingFieldName {
  ODOMETER
  TOTAL
  VOLUME
  UNIT_PRICE
  CURRENCY
  DATE
  TITLE
}

enum ReadingIssueCode {
  UNRECOGNISED
  NOTHING_LEGIBLE
  NOT_UNDERSTOOD
  OUT_OF_RANGE
  ODOMETER_BELOW_LATEST
  ODOMETER_TOO_FAR_ABOVE
  ODOMETER_FAR_ABOVE
  DATE_TOO_OLD
  DATE_IN_FUTURE
  AMOUNTS_DO_NOT_ADD
  NO_CONFIDENCE
  UNSURE
}

enum ReadingStatus {
  QUEUED
  READING
  READ
  FAILED
}

enum RecurrenceKind {
  TIME
  ODOMETER
  COMBINED
}

enum RecurrenceLimit {
  TIME
  ODOMETER
}

enum RecurrenceState {
  UPCOMING
  DUE_SOON
  OVERDUE
}

enum RefuelingSortField {
  DATE
  VOLUME
  TOTAL_COST
  ODOMETER
  PRICE_PER_UNIT
  CONSUMPTION
  CREATED_BY
  VEHICLE
  DELETED_AT
}

enum ReviewState {
  NONE
  AWAITING_PHOTOS
  NEEDS_REVIEW
  INCOMPLETE
}

enum SortDirection {
  ASC
  DESC
}

enum UserDataDisposition {
  MOVE
  PURGE
}

enum UserProvider {
  LOCAL
  OIDC
  PROXY
}

enum VehicleSortField {
  NAME
  LICENSE_PLATE
  FUEL_TYPE
  OWNER
  REFUELING_COUNT
  DELETED_AT
}

enum VolumeUnit {
  LITERS
  US_GALLONS
  IMPERIAL_GALLONS
}

"The `Any` scalar type represents any valid GraphQL value."
scalar Any @specifiedBy(url: "https://scalars.graphql.org/chillicream/any.html")

"The `DateTime` scalar type represents a date and time with time zone offset information."
scalar DateTime
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/date-time.html")

"The `Decimal` scalar type represents a decimal floating-point number with high precision."
scalar Decimal
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/decimal.html")

"The `Duration` scalar type represents a duration of time."
scalar Duration
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/duration.html")

"The `LocalDate` scalar type represents a date without time or time zone information."
scalar LocalDate
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/local-date.html")

"The `Long` scalar type represents a signed 64-bit integer."
scalar Long
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/long.html")

"The `UUID` scalar type represents a Universally Unique Identifier (UUID) as defined by RFC 9562."
scalar UUID
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/uuid.html")

"The purpose of the `cost` directive is to define a `weight` for GraphQL types, fields, and arguments. Static analysis can use these weights when calculating the overall cost of a query or response."
directive @cost(
  "The `weight` argument defines what value to add to the overall cost for every appearance, or possible appearance, of a type, field, argument, etc."
  weight: String!
) on
  | SCALAR
  | OBJECT
  | FIELD_DEFINITION
  | ARGUMENT_DEFINITION
  | ENUM
  | INPUT_FIELD_DEFINITION
