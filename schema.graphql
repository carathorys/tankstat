schema {
  query: Query
  mutation: Mutation
}

type Query {
  health: HealthReport! @cost(weight: "10")
  myVehicles(search: String, skip: Int! = 0, take: Int! = 50): [Vehicle!]!
    @cost(weight: "10")
  myVehicleCount(search: String): Int! @cost(weight: "10")
  vehicles(
    orderBy: VehicleSortField! = NAME
    direction: SortDirection! = ASC
    skip: Int! = 0
    take: Int! = 50
  ): [Vehicle!]! @cost(weight: "10")
  vehicleCount: Int! @cost(weight: "10")
  trash(
    orderBy: VehicleSortField! = DELETED_AT
    direction: SortDirection! = DESC
    skip: Int! = 0
    take: Int! = 50
  ): [Vehicle!]! @cost(weight: "10")
  trashCount: Int! @cost(weight: "10")
  trashDeletableCount: Int! @cost(weight: "10")
  vehicleDefaults: VehicleDefaults!
  vehicle(id: UUID!): Vehicle @cost(weight: "10")
  session: Session! @cost(weight: "10")
  notices: [Notice!]!
  passwordRequirements: PasswordRequirementsInfo!
  users: [UserAccount!]! @cost(weight: "10")
  canSetUserPasswords: Boolean! @cost(weight: "10")
  accessSettings: AccessSettingsInfo! @cost(weight: "10")
  accessGrants: [AccessGrantInfo!]! @cost(weight: "10")
  backups: BackupOverviewInfo! @cost(weight: "10")
  backupDetails(file: String!): BackupDetailsInfo! @cost(weight: "10")
  mySessions: [UserSessionInfo!]! @cost(weight: "10")
  setup: SetupInfo! @cost(weight: "10")
  setupRestorePoints(code: String!): [RestorePointInfo!]! @cost(weight: "10")
  setupBackupDetails(code: String!, file: String!): BackupDetailsInfo!
    @cost(weight: "10")
  setupUploadLimitMb(code: String!): Int! @cost(weight: "10")
  refuelings(
    vehicleId: UUID!
    orderBy: RefuelingSortField! = DATE
    direction: SortDirection! = DESC
    skip: Int! = 0
    take: Int! = 50
  ): [Refueling!]! @cost(weight: "10")
  refuelingCount(vehicleId: UUID!): Int! @cost(weight: "10")
  refueling(id: UUID!): Refueling @cost(weight: "10")
  logDefaults(vehicleId: UUID!): LogDefaults @cost(weight: "10")
  refuelingTrash(
    orderBy: RefuelingSortField! = DELETED_AT
    direction: SortDirection! = DESC
    skip: Int! = 0
    take: Int! = 50
  ): [Refueling!]! @cost(weight: "10")
  refuelingTrashCount: Int! @cost(weight: "10")
  refuelingTrashDeletableCount: Int! @cost(weight: "10")
  vehicleLogAccess(vehicleId: UUID!): [LogAccessGrantInfo!]! @cost(weight: "10")
  shareCandidates(vehicleId: UUID!): [UserRef!]! @cost(weight: "10")
  expenses(
    vehicleId: UUID!
    orderBy: ExpenseSortField! = DATE
    direction: SortDirection! = DESC
    skip: Int! = 0
    take: Int! = 50
  ): [Expense!]! @cost(weight: "10")
  expenseCount(vehicleId: UUID!): Int! @cost(weight: "10")
  expense(id: UUID!): Expense @cost(weight: "10")
  expenseCategories(vehicleId: UUID!): [String!]! @cost(weight: "10")
  expenseTrash(
    orderBy: ExpenseSortField! = DELETED_AT
    direction: SortDirection! = DESC
    skip: Int! = 0
    take: Int! = 50
  ): [Expense!]! @cost(weight: "10")
  expenseTrashCount: Int! @cost(weight: "10")
  expenseTrashDeletableCount: Int! @cost(weight: "10")
  vehicleTyres(vehicleId: UUID!): VehicleTyres @cost(weight: "10")
  tyreTrash(
    orderBy: TyreTrashSortField! = DELETED_AT
    direction: SortDirection! = DESC
    skip: Int! = 0
    take: Int! = 50
  ): [TyreTrashRow!]! @cost(weight: "10")
  tyreTrashCount: Int! @cost(weight: "10")
  tyreTrashDeletableCount: Int! @cost(weight: "10")
  notifications(unreadOnly: Boolean! = false, skip: Int! = 0, take: Int! = 20): [NotificationInfo!]!
    @cost(weight: "10")
  notificationCount(unreadOnly: Boolean! = false): Int! @cost(weight: "10")
  recognitionStatus: RecognitionStatusInfo! @cost(weight: "10")
  photoDrafts(ids: [UUID!]!): [PhotoDraftInfo!]! @cost(weight: "10")
  importPreview(token: String!, vehicleId: UUID): ImportPreviewInfo!
    @cost(weight: "10")
  importFormats: [String!]!
  vehicleChartData(vehicleId: UUID!, config: ChartConfigInput!): ChartData!
    @cost(weight: "10")
  vehicleTrend(
    vehicleId: UUID!
    figure: TrendFigure!
    period: TrendPeriodInput!
  ): TrendFigureData! @cost(weight: "10")
  vehicleFigure(
    vehicleId: UUID!
    measure: FigureMeasure!
    period: TrendPeriodInput
  ): FigureData! @cost(weight: "10")
  vehicleCharts(vehicleId: UUID!): [VehicleChart!]! @cost(weight: "10")
  vehicleWidgets(vehicleId: UUID!): [SavedWidget!]! @cost(weight: "10")
  uiSettings: UiSettingsInfo! @cost(weight: "10")
  offlineChanges(input: OfflineChangesInput!): OfflineChanges!
    @cost(weight: "10")
  offlineSettings: OfflineSettingsInfo! @cost(weight: "10")
  parkedChanges: [SyncChangeInfo!]! @cost(weight: "10")
  systemSettings(code: String): SystemSettingsInfo! @cost(weight: "10")
}

type Mutation {
  addVehicle(input: AddVehicleInput!): Vehicle! @cost(weight: "10")
  updateVehicle(input: UpdateVehicleInput!): Vehicle! @cost(weight: "10")
  deleteVehicle(id: UUID!): Vehicle! @cost(weight: "10")
  restoreVehicle(id: UUID!): Vehicle! @cost(weight: "10")
  emptyTrash: Int! @cost(weight: "10")
  login(input: LoginInput!): UserInfo! @cost(weight: "10")
  logout: Boolean! @cost(weight: "10")
  changePassword(input: ChangePasswordInput!): Boolean! @cost(weight: "10")
  requestPasswordReset(email: String!): Boolean! @cost(weight: "10")
  resetPassword(input: ResetPasswordInput!): Boolean! @cost(weight: "10")
  createUser(input: CreateUserInput!): CreatedUser! @cost(weight: "10")
  issuePasswordReset(userId: UUID!): PasswordResetLink! @cost(weight: "10")
  setUserAdmin(userId: UUID!, isAdmin: Boolean!): UserAccount!
    @cost(weight: "10")
  setUserDisabled(userId: UUID!, disabled: Boolean!): UserAccount!
    @cost(weight: "10")
  updateUser(input: UpdateUserInput!): UserAccount! @cost(weight: "10")
  setUserPassword(
    userId: UUID!
    newPassword: String!
    newPasswordConfirmation: String
  ): Boolean! @cost(weight: "10")
  deleteUser(input: DeleteUserInput!): Boolean! @cost(weight: "10")
  setDefaultAccess(level: AccessLevel!): AccessSettingsInfo! @cost(weight: "10")
  setAccessGrant(input: SetAccessGrantInput!): Boolean! @cost(weight: "10")
  restoreBackup(input: RestoreBackupInput!): RestorePendingInfo!
    @cost(weight: "10")
  runBackup: Boolean! @cost(weight: "10")
  deleteBackup(file: String!): Boolean! @cost(weight: "10")
  holdBackup(file: String!, hold: Boolean!): Boolean! @cost(weight: "10")
  prepareBackupEncryption(passphrase: String, passphraseConfirmation: String): BackupKeySetInfo!
    @cost(weight: "10")
  revokeSession(id: UUID!): Boolean! @cost(weight: "10")
  revokeOtherSessions: Int! @cost(weight: "10")
  setupFinish(input: SetupFinishInput!): SetupFinishInfo! @cost(weight: "10")
  setupClaimAdministrator(code: String!): UserInfo! @cost(weight: "10")
  logRefueling(input: LogRefuelingInput!): Refueling! @cost(weight: "10")
  updateRefueling(input: UpdateRefuelingInput!): Refueling! @cost(weight: "10")
  deleteRefueling(id: UUID!): Refueling! @cost(weight: "10")
  restoreRefueling(id: UUID!): Refueling! @cost(weight: "10")
  emptyRefuelingTrash: Int! @cost(weight: "10")
  setVehicleLogAccess(input: SetLogAccessInput!): Boolean! @cost(weight: "10")
  addExpense(input: AddExpenseInput!): Expense! @cost(weight: "10")
  updateExpense(input: UpdateExpenseInput!): Expense! @cost(weight: "10")
  deleteExpense(id: UUID!): Expense! @cost(weight: "10")
  restoreExpense(id: UUID!): Expense! @cost(weight: "10")
  emptyExpenseTrash: Int! @cost(weight: "10")
  addRecurringExpense(input: AddRecurringExpenseInput!): RecurringExpenseInfo!
    @cost(weight: "10")
  updateRecurringExpense(input: UpdateRecurringExpenseInput!): RecurringExpenseInfo!
    @cost(weight: "10")
  deleteRecurringExpense(id: UUID!): Boolean! @cost(weight: "10")
  markRecurringExpensesDone(input: MarkRecurringExpensesDoneInput!): MarkRecurringExpensesDonePayload!
    @cost(weight: "10")
  addTyreSet(input: AddTyreSetInput!): VehicleTyres! @cost(weight: "10")
  updateTyreSet(input: UpdateTyreSetInput!): VehicleTyres! @cost(weight: "10")
  setTyreRoughDistance(input: SetTyreRoughDistanceInput!): VehicleTyres!
    @cost(weight: "10")
  swapTyres(input: SwapTyresInput!): VehicleTyres! @cost(weight: "10")
  changeTyrePositions(input: SwapTyresInput!): VehicleTyres! @cost(weight: "10")
  addPastTyreSwaps(input: AddPastTyreSwapsInput!): VehicleTyres!
    @cost(weight: "10")
  addTyreInstallation(input: AddTyreInstallationInput!): VehicleTyres!
    @cost(weight: "10")
  updateTyreInstallation(input: UpdateTyreInstallationInput!): VehicleTyres!
    @cost(weight: "10")
  deleteTyreInstallation(id: UUID!): VehicleTyres! @cost(weight: "10")
  restoreTyreInstallation(id: UUID!): VehicleTyres! @cost(weight: "10")
  addTyreEntry(input: AddTyreEntryInput!): VehicleTyres! @cost(weight: "10")
  updateTyreEntry(input: UpdateTyreEntryInput!): VehicleTyres!
    @cost(weight: "10")
  deleteTyreEntry(input: DeleteTyreEntryInput!): VehicleTyres!
    @cost(weight: "10")
  restoreTyreEntry(id: UUID!): VehicleTyres! @cost(weight: "10")
  retireTyreSet(id: UUID!, day: LocalDate!): VehicleTyres! @cost(weight: "10")
  unretireTyreSet(id: UUID!): VehicleTyres! @cost(weight: "10")
  deleteTyreSet(id: UUID!): VehicleTyres! @cost(weight: "10")
  restoreTyreSet(id: UUID!): VehicleTyres! @cost(weight: "10")
  breakUpTyreSet(input: BreakUpTyreSetInput!): VehicleTyres! @cost(weight: "10")
  replaceTyres(input: ReplaceTyresInput!): VehicleTyres! @cost(weight: "10")
  updateTyre(input: UpdateTyreInput!): VehicleTyres! @cost(weight: "10")
  deleteTyre(id: UUID!): VehicleTyres! @cost(weight: "10")
  restoreTyre(id: UUID!): VehicleTyres! @cost(weight: "10")
  addTyrePlace(input: AddTyrePlaceInput!): VehicleTyres! @cost(weight: "10")
  updateTyrePlace(input: UpdateTyrePlaceInput!): VehicleTyres!
    @cost(weight: "10")
  deleteTyrePlace(id: UUID!): VehicleTyres! @cost(weight: "10")
  restoreTyrePlace(id: UUID!): VehicleTyres! @cost(weight: "10")
  emptyTyreTrash: Int! @cost(weight: "10")
  markNotificationsRead(ids: [UUID!]): [NotificationInfo!]! @cost(weight: "10")
  confirmImport(input: ConfirmImportInput!): ImportResultInfo!
    @cost(weight: "10")
  saveVehicleChart(input: SaveChartInput!): VehicleChart! @cost(weight: "10")
  saveVehicleWidget(input: SaveWidgetInput!): SavedWidget! @cost(weight: "10")
  deleteVehicleChart(id: UUID!): Boolean! @cost(weight: "10")
  saveDashboardLayout(input: SaveDashboardLayoutInput!): Boolean!
    @cost(weight: "10")
  resetDashboardLayout(vehicleId: UUID!, personal: Boolean!): Boolean!
    @cost(weight: "10")
  updateUiSettings(input: UpdateUiSettingsInput!): UiSettingsInfo!
    @cost(weight: "10")
  saveGridSettings(input: GridSettingsInput!): GridSettingsInfo!
    @cost(weight: "10")
  resetGridSettings(gridId: String!): Boolean! @cost(weight: "10")
  setVehicleOrder(vehicleIds: [UUID!]!): Boolean! @cost(weight: "10")
  updateOfflineSettings(input: UpdateOfflineSettingsInput!): OfflineSettingsInfo!
    @cost(weight: "10")
  syncChanges(input: SyncChangesInput!): SyncResultInfo! @cost(weight: "10")
  resolveSyncChange(input: ResolveSyncChangeInput!): SyncChangeInfo!
    @cost(weight: "10")
  updateSystemSettings(changes: [SystemSettingChangeInput!]!, code: String): SystemSettingsInfo!
    @cost(weight: "10")
  restartServer(code: String): Boolean! @cost(weight: "10")
}

type AccessGrantInfo {
