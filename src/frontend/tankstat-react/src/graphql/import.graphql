# Importing from another app: the file is uploaded with POST /imports/{format} (which answers a token); the rest is GraphQL.
query ImportPreview($token: String!, $vehicleId: UUID) {
  importPreview(token: $token, vehicleId: $vehicleId) {
    fuelRows
    expenseRows
    recurringRows
    duplicateFuelRows
    duplicateExpenseRows
    duplicateRecurringRows
    firstDate
    lastDate
    categories
    sourceVehicle {
      name
      licensePlate
      fuelType
      distanceUnit
      volumeUnit
    }
    issues {
      section
      row
      key
      args
    }
  }
}

# Vehicles the user may import into (those whose logs they may edit).
query ImportTargets {
  myVehicles(take: 200) {
    id
    name
    licensePlate
    canEdit
    logAccess
    units {
      distance
      volume
    }
  }
}

mutation ConfirmImport($input: ConfirmImportInput!) {
  confirmImport(input: $input) {
    vehicleId
    fuelImported
    expensesImported
    recurringImported
    fuelSkippedDuplicates
    expensesSkippedDuplicates
    recurringSkippedDuplicates
    errors {
      section
      row
      key
      args
    }
  }
}

# Importing cars from a Tankstat backup or export (#336): the file is uploaded with POST /imports/tankstat (which answers its token);
# how its opening stands is asked here, again while it is OPENING (a large file takes longer than a request may).
fragment BackupImportFields on BackupImportInfo {
  token
  state
  triesLeft
  wrongKey
  refusal {
    key
    args
  }
  file {
    createdAt
    version
    isExport
    trashedCars
    cars {
      id
      name
      licensePlate
      ownerName
      refuelings
      expenses
      schedules
    }
  }
}

query BackupImport($token: String!) {
  backupImport(token: $token) {
    ...BackupImportFields
  }
}

mutation OpenBackupImport($input: OpenBackupImportInput!) {
  openBackupImport(input: $input) {
    ...BackupImportFields
  }
}

mutation EndBackupImport($token: String!) {
  endBackupImport(token: $token)
}
