# Importing from another app: the file is uploaded with POST /imports/{format} (which answers a token); the rest is GraphQL.
query ImportPreview($token: String!, $vehicleId: UUID) {
  importPreview(token: $token, vehicleId: $vehicleId) {
    fuelRows
    expenseRows
    recurringRows
    duplicateFuelRows
    duplicateExpenseRows
    duplicateRecurringRows
    firstDate
    lastDate
    categories
    sourceVehicle {
      name
      licensePlate
      fuelType
      distanceUnit
      volumeUnit
    }
    issues {
      section
      row
      key
      args
    }
  }
}

# Vehicles the user may import into (those whose logs they may edit).
query ImportTargets {
  myVehicles(take: 200) {
    id
    name
    licensePlate
    canEdit
    logAccess
    units {
      distance
      volume
    }
  }
}

mutation ConfirmImport($input: ConfirmImportInput!) {
  confirmImport(input: $input) {
    vehicleId
    fuelImported
    expensesImported
    recurringImported
    fuelSkippedDuplicates
    expensesSkippedDuplicates
    recurringSkippedDuplicates
    errors {
      section
      row
      key
      args
    }
  }
}

# Importing cars from a Tankstat backup or export (#336): the file is uploaded with POST /imports/tankstat (which answers its token);
# how its opening stands is asked here, again while it is OPENING (a large file takes longer than a request may).
fragment BackupImportFields on BackupImportInfo {
  token
  state
  triesLeft
  wrongKey
  refusal {
    key
    args
  }
  file {
    createdAt
    version
    isExport
    trashedCars
    cars {
      id
      name
      licensePlate
      ownerName
      refuelings
      expenses
      schedules
    }
  }
}

query BackupImport($token: String!) {
  backupImport(token: $token) {
    ...BackupImportFields
  }
}

mutation OpenBackupImport($input: OpenBackupImportInput!) {
  openBackupImport(input: $input) {
    ...BackupImportFields
  }
}

mutation EndBackupImport($token: String!) {
  endBackupImport(token: $token)
}

# The steps after the file (#337): the cars it offers, the review, the run and its report.
query CanImportFromBackup {
  canImportFromBackup
}

query BackupImportCars($token: String!) {
  backupImportCars(token: $token) {
    file {
      createdAt
      version
      trashedCars
    }
    cars {
      ownedByMe
      suggestedTargetId
      car {
        id
        name
        licensePlate
        ownerName
        distanceUnit
        volumeUnit
        refuelings
        expenses
        schedules
      }
    }
    targets {
      id
      name
      licensePlate
      distanceUnit
      volumeUnit
    }
  }
}

query BackupImportReview($token: String!, $cars: [ImportCarChoiceInput!]!) {
  backupImportReview(token: $token, cars: $cars) {
    carId
    name
    ownerName
    ownedByMe
    targetVehicleId
    targetName
    newRefuelings
    newExpenses
    newSchedules
    existingRefuelings
    existingExpenses
    existingSchedules
    differing
    inTrash
  }
}

fragment ImportRunFields on ImportRunInfo {
  id
  kind
  startedByName
  mine
  state
  failure
  queuedAt
  startedAt
  ahead
  fileToken
  limitMinutes
  progress {
    car
    cars
    done
    total
  }
  cars {
    carId
    name
    targetName
  }
  report {
    carId
    name
    vehicleId
    targetName
    asNew
    leftOut
    refuelings
    expenses
    schedules
    existing
    differing
    inTrash
    refusedMore
    refused {
      kind
      date
      title
      key
      args
    }
  }
}

query ImportRun($id: UUID!) {
  importRun(id: $id) {
    ...ImportRunFields
  }
}

query MyImportRun {
  myImportRun {
    ...ImportRunFields
  }
}

# Administrators: every import that goes or waits.
query ImportRuns {
  importRuns {
    ...ImportRunFields
  }
}

mutation StartBackupImport($input: StartBackupImportInput!) {
  startBackupImport(input: $input) {
    ...ImportRunFields
  }
}

mutation CancelImportRun($id: UUID!) {
  cancelImportRun(id: $id)
}
