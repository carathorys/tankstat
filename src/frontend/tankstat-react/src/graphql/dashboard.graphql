# What a card on the home page shows of a vehicle. `Welcome` lists them and `VehicleCard` reloads one after a quick action on it; both ask
# for exactly these fields, so Apollo updates the normalised Vehicle in place and the card re-renders without the home page being asked again.
fragment VehicleCardFields on Vehicle {
  id
  version
  name
  licensePlate
  fuelType
  pictureUrl
  canEdit
  logAccess
  units {
    distance
    volume
  }
  owner {
    id
    displayName
    avatarUrl
  }
  # What needs attention on the card: the client shows the ones that are due soon or overdue.
  recurring {
    id
    title
    category
    kind
    status {
      ...RecurrenceStatusFields
    }
  }
  summary {
    lastFillUpDate
    latestOdometer
    averageConsumption
    currency
    thisMonthSpend
    lastMonthSpend
    # Every currency spent in this month or last month, the main one first: money is never converted.
    spending {
      currency
      thisMonth
      lastMonth
    }
    fillUpCount
    expenseCount
    spendTrend {
      month
      amount
    }
  }
}

# The home page: a page of cards (infinite scroll) for the vehicles the user owns or that are shared with them, optionally searched by name or plate, with the key figures the server calculated.
query Welcome($search: String, $skip: Int!, $take: Int!) {
  myVehicles(search: $search, skip: $skip, take: $take) {
    ...VehicleCardFields
  }
  myVehicleCount(search: $search)
  # How many there are in all: the Arrange button is for two or more vehicles, whatever a search left on the page.
  vehicleTotal: myVehicleCount
}

# One card, asked again after a quick action on it (components/useCardActions.ts).
query VehicleCard($id: UUID!) {
  vehicle(id: $id) {
    ...VehicleCardFields
  }
}

# A vehicle's dashboard: the key figures, how it is arranged (the vehicle's and the user's own; never asked for a list of vehicles: it is
# resolved per vehicle) and the saved charts (the user's own and the shared ones). Each chart loads its own data.
query VehicleDashboard($id: UUID!) {
  vehicle(id: $id) {
    id
    dashboard {
      canChangeShared
      shared {
        ...DashboardLayoutFields
      }
      personal {
        ...DashboardLayoutFields
      }
    }
    summary {
      lastFillUpDate
      latestOdometer
      averageConsumption
      currency
      thisMonthSpend
      lastMonthSpend
      spending {
        currency
        thisMonth
        lastMonth
      }
      fillUpCount
      expenseCount
      spendTrend {
        month
        amount
      }
    }
  }
  vehicleCharts(vehicleId: $id) {
    id
    title
    metric
    grouping
    kind
    range
    rangeFrom
    rangeTo
    stacked
    trend
    runningTotal
    compareYearEarlier
    secondMetric
    secondKind
    isShared
    canEdit
    canDelete
    createdBy {
      id
      displayName
      avatarUrl
    }
  }
}

fragment DashboardLayoutFields on DashboardLayoutInfo {
  tiles {
    id
    x
    y
    w
    h
    pinned
    # A trend figure's own period (#230); null for its default.
    period {
      ...TrendPeriodFields
    }
  }
  hidden
}

fragment TrendPeriodFields on TrendPeriod {
  kind
  unit
  count
  since
  whole
  against
}

# A trend figure over its period (#230): each trend tile asks its own, as a chart tile asks its data.
query VehicleTrend($vehicleId: UUID!, $figure: TrendFigure!, $period: TrendPeriodInput!) {
  vehicleTrend(vehicleId: $vehicleId, figure: $figure, period: $period) {
    recent {
      start
      end
      fillUps
    }
    earlier {
      start
      end
      fillUps
    }
    currencies {
      currency
      recent
      earlier
    }
    consumption {
      recent
      earlier
      recentFillUps
      earlierFillUps
    }
    distance {
      recent
      earlier
    }
  }
}

# A key figure (#272): any measure over a period of its own, compared or not, or a point in time (the odometer, the last fill-up) without
# a period. #274's key figure tile asks it; kept offline (snapshotPolicy), answered by the device for a vehicle added there.
query VehicleFigure($vehicleId: UUID!, $measure: FigureMeasure!, $period: TrendPeriodInput) {
  vehicleFigure(vehicleId: $vehicleId, measure: $measure, period: $period) {
    recent {
      start
      end
      fillUps
    }
    earlier {
      start
      end
      fillUps
    }
    unit
    currencies {
      currency
      recent
      earlier
    }
    value {
      recent
      earlier
    }
    lastFillUp {
      date
      fillUps
      expenses
    }
  }
}

# The saved widgets of both kinds (#273), charts and key figures; the dashboard switches to it from #274 (vehicleCharts stays for an older app).
query VehicleWidgets($vehicleId: UUID!) {
  vehicleWidgets(vehicleId: $vehicleId) {
    id
    title
    widget
    chart {
      ...ChartConfigFields
    }
    figure {
      ...FigureRecipeFields
    }
    isShared
    canEdit
    canDelete
    createdBy {
      id
      displayName
      avatarUrl
    }
  }
}

fragment ChartConfigFields on ChartConfig {
  metric
  grouping
  kind
  range
  from
  to
  stacked
  trend
  runningTotal
  compareYearEarlier
  secondMetric
  secondKind
}

fragment FigureRecipeFields on FigureRecipe {
  measure
  period {
    ...TrendPeriodFields
  }
  sparkline
  template
}

mutation SaveDashboardLayout($input: SaveDashboardLayoutInput!) {
  saveDashboardLayout(input: $input)
}

mutation ResetDashboardLayout($vehicleId: UUID!, $personal: Boolean!) {
  resetDashboardLayout(vehicleId: $vehicleId, personal: $personal)
}

query ChartData($vehicleId: UUID!, $config: ChartConfigInput!) {
  vehicleChartData(vehicleId: $vehicleId, config: $config) {
    unit
    series {
      kind
      currency
      # A trend or a year earlier is drawn as a line over the values of the same kind and currency.
      role
      slope
      # A chart can have two measures: each series says which it belongs to and the unit it is written in.
      metric
      unit
      points {
        key
        value
      }
    }
  }
}

mutation SaveChart($input: SaveChartInput!) {
  saveVehicleChart(input: $input) {
    id
  }
}

mutation DeleteChart($id: UUID!) {
  deleteVehicleChart(id: $id)
}

# The Arrange dialog's own list: every vehicle the user may see, in the current order (asked afresh each time the dialog opens).
query ArrangeVehicles {
  myVehicles(take: 200) {
    id
    name
    licensePlate
  }
}

mutation SetVehicleOrder($vehicleIds: [UUID!]!) {
  setVehicleOrder(vehicleIds: $vehicleIds)
}
