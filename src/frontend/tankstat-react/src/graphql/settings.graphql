# What the UI remembers for the signed-in user (or for everyone, with authentication off): asked once per session by UiSettingsProvider.
# The browser keeps a copy of every setting, so the first paint never waits for this.
query UiSettings {
  uiSettings {
    navOpen
    language
    colorMode
    surface
    timeFormat
    dateFormat
    defaultTimeFormat
    defaultDateFormat
    timeline {
      ...TimelineSettingsFields
    }
    grids {
      gridId
      order
      hidden
      pageSize
      sortColumn
      sortDirection
    }
  }
}

mutation UpdateUiSettings($input: UpdateUiSettingsInput!) {
  updateUiSettings(input: $input) {
    navOpen
    language
    colorMode
    surface
    timeFormat
    dateFormat
    defaultTimeFormat
    defaultDateFormat
    timeline {
      ...TimelineSettingsFields
    }
  }
}

mutation SaveGridSettings($input: GridSettingsInput!) {
  saveGridSettings(input: $input) {
    gridId
    order
    hidden
    pageSize
    sortColumn
    sortDirection
  }
}

mutation ResetGridSettings($gridId: String!) {
  resetGridSettings(gridId: $gridId)
}

# What the tyre timeline shows (#332): the range, the layers shown and the sets hidden; null when the user never chose.
fragment TimelineSettingsFields on TimelineSettingsInfo {
  range
  layers
  hiddenSets
}
