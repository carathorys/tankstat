<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5472e4"/>
      <stop offset="1" stop-color="#1f2a6b"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- pump body -->
  <rect x="118" y="380" width="236" height="34" rx="12" fill="#eef2ff"/>
  <rect x="136" y="104" width="200" height="290" rx="30" fill="#ffffff"/>

  <!-- display with rising consumption bars -->
  <rect x="166" y="140" width="140" height="124" rx="18" fill="#1b2660"/>
  <rect x="186" y="208" width="24" height="36" rx="6" fill="url(#bars)"/>
  <rect x="224" y="180" width="24" height="64" rx="6" fill="url(#bars)"/>
  <rect x="262" y="156" width="24" height="88" rx="6" fill="url(#bars)"/>

  <!-- nozzle holster -->
  <rect x="166" y="292" width="140" height="26" rx="13" fill="#c7d2fe"/>
  <rect x="166" y="336" width="88" height="18" rx="9" fill="#c7d2fe"/>

  <!-- hose -->
  <path d="M330 178 C 400 178, 420 200, 420 262 L 420 300"
        fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>

  <!-- nozzle -->
  <rect x="392" y="286" width="56" height="78" rx="16" fill="#ffffff"/>
  <path d="M402 356 L 402 388 Q 402 402 416 402 L 442 402 Q 452 402 452 392 L 452 380 Q 452 372 444 368 L 426 358 Z" fill="#ffffff"/>
</svg>
