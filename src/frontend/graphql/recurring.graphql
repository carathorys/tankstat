# Where a schedule stands. Every document that loads a status asks for this one selection: the cache keeps a single status object per
# schedule, and two documents asking for different fields would write over each other's (Apollo warns about the data loss).
fragment RecurrenceStatusFields on RecurrenceStatusInfo {
  state
  limit
  dueDate
  dueOdometer
  daysLeft
  distanceLeft
}

# A vehicle's recurring expenses (schedules such as insurance or an oil change) with where each one stands. Few per vehicle, so no paging.
fragment RecurringFields on RecurringExpenseInfo {
  id
  version
  title
  category
  note
  kind
  intervalMonths
  intervalDistance
  lastDoneDate
  lastDoneOdometer
  warnDays
  warnDistance
  status {
    ...RecurrenceStatusFields
  }
}

query RecurringExpenses($vehicleId: UUID!) {
  vehicle(id: $vehicleId) {
    id
    recurring {
      ...RecurringFields
    }
  }
}

mutation AddRecurringExpense($input: AddRecurringExpenseInput!) {
  addRecurringExpense(input: $input) {
    ...RecurringFields
  }
}

mutation UpdateRecurringExpense($input: UpdateRecurringExpenseInput!) {
  updateRecurringExpense(input: $input) {
    ...RecurringFields
  }
}

mutation DeleteRecurringExpense($id: UUID!) {
  deleteRecurringExpense(id: $id)
}

# One service visit: several schedules of a vehicle done together; with an amount (or photos), one expense for all of them.
mutation MarkRecurringExpensesDone($input: MarkRecurringExpensesDoneInput!) {
  markRecurringExpensesDone(input: $input) {
    schedules {
      ...RecurringFields
    }
    expense {
      id
      photos {
        id
      }
    }
  }
}
