# The home page: a card per vehicle the user owns or that is shared with them, with the key figures the server calculated.
query Welcome {
  myVehicles {
    id
    name
    licensePlate
    fuelType
    pictureUrl
    canEdit
    logAccess
    units {
      distance
      volume
    }
    owner {
      id
      displayName
      avatarUrl
    }
    summary {
      lastFillUpDate
      latestOdometer
      averageConsumption
      currency
      thisMonthSpend
      lastMonthSpend
      fillUpCount
      expenseCount
      spendTrend {
        month
        amount
      }
    }
  }
}

# A vehicle's dashboard: the key figures and the saved charts (the user's own and the shared ones). Each chart loads its own data.
query VehicleDashboard($id: UUID!) {
  vehicle(id: $id) {
    id
    summary {
      lastFillUpDate
      latestOdometer
      averageConsumption
      currency
      thisMonthSpend
      lastMonthSpend
      fillUpCount
      expenseCount
      spendTrend {
        month
        amount
      }
    }
  }
  vehicleCharts(vehicleId: $id) {
    id
    title
    metric
    grouping
    kind
    range
    rangeFrom
    rangeTo
    stacked
    isShared
    canEdit
    createdBy {
      id
      displayName
      avatarUrl
    }
  }
}

query ChartData($vehicleId: UUID!, $config: ChartConfigInput!) {
  vehicleChartData(vehicleId: $vehicleId, config: $config) {
    unit
    series {
      kind
      currency
      points {
        key
        value
      }
    }
  }
}

mutation SaveChart($input: SaveChartInput!) {
  saveVehicleChart(input: $input) {
    id
  }
}

mutation DeleteChart($id: UUID!) {
  deleteVehicleChart(id: $id)
}
