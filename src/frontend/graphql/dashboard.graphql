# The home page: a page of cards (infinite scroll) for the vehicles the user owns or that are shared with them, optionally searched by name or plate, with the key figures the server calculated.
query Welcome($search: String, $skip: Int!, $take: Int!) {
  myVehicles(search: $search, skip: $skip, take: $take) {
    id
    name
    licensePlate
    fuelType
    pictureUrl
    canEdit
    logAccess
    units {
      distance
      volume
    }
    owner {
      id
      displayName
      avatarUrl
    }
    # What needs attention on the card: the client shows the ones that are due soon or overdue.
    recurring {
      id
      title
      kind
      status {
        state
        limit
        dueDate
        daysLeft
        distanceLeft
      }
    }
    summary {
      lastFillUpDate
      latestOdometer
      averageConsumption
      currency
      thisMonthSpend
      lastMonthSpend
      fillUpCount
      expenseCount
      spendTrend {
        month
        amount
      }
    }
  }
  myVehicleCount(search: $search)
  # How many there are in all: the Arrange button is for two or more vehicles, whatever a search left on the page.
  vehicleTotal: myVehicleCount
}

# A vehicle's dashboard: the key figures and the saved charts (the user's own and the shared ones). Each chart loads its own data.
query VehicleDashboard($id: UUID!) {
  vehicle(id: $id) {
    id
    summary {
      lastFillUpDate
      latestOdometer
      averageConsumption
      currency
      thisMonthSpend
      lastMonthSpend
      fillUpCount
      expenseCount
      spendTrend {
        month
        amount
      }
    }
  }
  vehicleCharts(vehicleId: $id) {
    id
    title
    metric
    grouping
    kind
    range
    rangeFrom
    rangeTo
    stacked
    isShared
    canEdit
    createdBy {
      id
      displayName
      avatarUrl
    }
  }
}

query ChartData($vehicleId: UUID!, $config: ChartConfigInput!) {
  vehicleChartData(vehicleId: $vehicleId, config: $config) {
    unit
    series {
      kind
      currency
      points {
        key
        value
      }
    }
  }
}

mutation SaveChart($input: SaveChartInput!) {
  saveVehicleChart(input: $input) {
    id
  }
}

mutation DeleteChart($id: UUID!) {
  deleteVehicleChart(id: $id)
}

# The Arrange dialog's own list: every vehicle the user may see, in the current order (asked afresh each time the dialog opens).
query ArrangeVehicles {
  myVehicles(take: 200) {
    id
    name
    licensePlate
  }
}

mutation SetVehicleOrder($vehicleIds: [UUID!]!) {
  setVehicleOrder(vehicleIds: $vehicleIds)
}
