query Setup {
  setup {
    pending
  }
}

query SetupRestorePoints($code: String!) {
  setupRestorePoints(code: $code) {
    file
    createdAt
    appVersion
    sameMigration
    olderMigration
    encrypted
  }
}

mutation SetupCreateAdministrator($input: SetupAdministratorInput!) {
  setupCreateAdministrator(input: $input) {
    id
  }
}

mutation SetupClaimAdministrator($code: String!) {
  setupClaimAdministrator(code: $code) {
    id
  }
}

mutation SetupAcknowledgeOpenAccess($code: String!) {
  setupAcknowledgeOpenAccess(code: $code) {
    pending
  }
}
