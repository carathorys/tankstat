query Setup {
  setup {
    pending
  }
}

query SetupRestorePoints($code: String!) {
  setupRestorePoints(code: $code) {
    ...RestoreTargetFields
    sameMigration
  }
  # how large a backup the setup may upload (told with the code only, as the Backups page tells administrators only)
  setupUploadLimitMb(code: $code)
}

# A backup opened before it is restored, with the code (the Backups page's own view: BackupDetailsFields).
query SetupBackupDetails($code: String!, $file: String!) {
  setupBackupDetails(code: $code, file: $file) {
    ...BackupDetailsFields
  }
}

# The setup's last step: the gatekeeper of the sign-in mode the next start runs, then the restart the saved settings wait for.
mutation SetupFinish($input: SetupFinishInput!) {
  setupFinish(input: $input) {
    restarting
    signedIn
  }
}

mutation SetupClaimAdministrator($code: String!) {
  setupClaimAdministrator(code: $code) {
    id
  }
}

# The done screen's key set: the recipient alone (the Backups query's restore points and sizes read every backup and walk the folders).
query BackupRecipient {
  backups {
    settings {
      recipient
    }
  }
}
