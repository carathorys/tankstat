# What a device downloads of a vehicle to show it offline (offline/pull.ts). A log carries every field the grids, the details and the
# trash show, so the device can answer them itself (offline/localResolvers.ts); the vehicle and its schedules come in the shapes of
# VehicleDetails and RecurringExpenses, whose answers the download keeps for those queries.
fragment OfflineRefuelingFields on Refueling {
  id
  vehicleId
  date
  volume
  totalCost
  currency
  pricePerUnit
  consumption
  odometer
  isFullTank
  missedPreviousFillUp
  note
  reviewState
  filledFromPhoto
  canEdit
  canDelete
  deletedAt
  version
  updatedAt
  createdBy {
    id
    displayName
    avatarUrl
  }
  photos {
    id
    url
  }
}

fragment OfflineExpenseFields on Expense {
  id
  vehicleId
  date
  title
  category
  amount
  currency
  odometer
  note
  reviewState
  filledFromPhoto
  canEdit
  canDelete
  deletedAt
  version
  updatedAt
  createdBy {
    id
    displayName
    avatarUrl
  }
  schedules {
    id
    title
  }
  photos {
    id
    url
  }
}

query OfflineChanges($input: OfflineChangesInput!) {
  offlineChanges(input: $input) {
    vehicle {
      ...VehicleDetailsFields
    }
    refuelings {
      ...OfflineRefuelingFields
    }
    expenses {
      ...OfflineExpenseFields
    }
    recurring {
      ...RecurringFields
    }
    removed {
      type
      id
    }
    next
    watermark
    resync
  }
}

# The user's offline window: a rule for every vehicle, and the ones that differ (offline/offlineWindow.ts).
query OfflineSettings {
  offlineSettings {
    defaultWindow
    vehicles {
      vehicleId
      window
    }
  }
}

# The Account page's Offline data section: the vehicles a window can be chosen for (the home list, up to the server's page limit).
query OfflineVehicles {
  myVehicles(take: 200) {
    id
    name
  }
}

# How many logs a download from this day (null: all of them) would bring, per vehicle: one request per start date on the page.
query OfflineEstimates($from: LocalDate) {
  myVehicles(take: 200) {
    id
    logCountSince(from: $from) {
      refuelings
      expenses
    }
  }
}

mutation UpdateOfflineSettings($input: UpdateOfflineSettingsInput!) {
  updateOfflineSettings(input: $input) {
    defaultWindow
    vehicles {
      vehicleId
      window
    }
  }
}

# Sends the changes kept on this device (offline/push.ts): in order; each is applied, or parked with the reason the server gave.
mutation SyncChanges($input: SyncChangesInput!) {
  syncChanges(input: $input) {
    applied
    parked
    results {
      id
      status
      entityId
      version
      reason {
        key
        args {
          name
          value
        }
      }
    }
  }
}

# A change sent from a device that the server parked (pages/SyncPage.tsx): `change` is the ChangeInput as it was sent, as JSON, `base`
# the values it was made from (JSON, when the device knew them).
fragment ParkedChangeFields on SyncChangeInfo {
  id
  kind
  status
  vehicleId
  targetId
  change
  base
  receivedAt
  reason {
    key
    args {
      name
      value
    }
  }
  vehicle {
    id
    name
    distanceUnit
    volumeUnit
  }
  submittedBy {
    id
    displayName
  }
  canResolve
}

# The parked changes the user may see: of the vehicles they may see, and those they sent (the top bar and Waiting to sync).
query ParkedChanges {
  parkedChanges {
    ...ParkedChangeFields
  }
}

# Applies a parked change anyway, or discards it; a refusal keeps it parked and is this mutation's error.
mutation ResolveSyncChange($input: ResolveSyncChangeInput!) {
  resolveSyncChange(input: $input) {
    ...ParkedChangeFields
  }
}
