# Photo reading (optional, on the server): whether it is on, and what was read from the photos of the open add or edit dialog.

query RecognitionStatus {
  recognitionStatus {
    available
  }
}

fragment PhotoReadingFields on PhotoReadingInfo {
  status
  kind
  values {
    name
    value
    confidence
  }
  issues {
    code
    field
  }
}

query PhotoDraftReadings($ids: [UUID!]!) {
  photoDrafts(ids: $ids) {
    id
    reading {
      ...PhotoReadingFields
    }
  }
}

# The readings of a saved log's photos, for its edit dialog (photos added there are read too).
query RefuelingPhotoReadings($id: UUID!) {
  refueling(id: $id) {
    id
    photos {
      id
      reading {
        ...PhotoReadingFields
      }
    }
  }
}

query ExpensePhotoReadings($id: UUID!) {
  expense(id: $id) {
    id
    photos {
      id
      reading {
        ...PhotoReadingFields
      }
    }
  }
}
