# The grid asks only for the columns the user has switched on: each optional column has a
# Boolean variable that drives @include, so the server skips the fields (and their resolvers) otherwise.
query Vehicles(
  $orderBy: VehicleSortField!
  $direction: SortDirection!
  $skip: Int!
  $take: Int!
  $withLicensePlate: Boolean!
  $withFuelType: Boolean!
  $withOwner: Boolean!
  $withRefuelings: Boolean!
) {
  vehicles(orderBy: $orderBy, direction: $direction, skip: $skip, take: $take) {
    id
    name
    canEdit
    pictureUrl
    licensePlate @include(if: $withLicensePlate)
    fuelType @include(if: $withFuelType)
    owner @include(if: $withOwner) {
      id
      displayName
      avatarUrl
    }
    refuelingCount @include(if: $withRefuelings)
  }
  vehicleCount
}

query Trash(
  $orderBy: VehicleSortField!
  $direction: SortDirection!
  $skip: Int!
  $take: Int!
  $withLicensePlate: Boolean!
  $withFuelType: Boolean!
  $withOwner: Boolean!
  $withDeletedAt: Boolean!
) {
  trash(orderBy: $orderBy, direction: $direction, skip: $skip, take: $take) {
    id
    name
    pictureUrl
    licensePlate @include(if: $withLicensePlate)
    fuelType @include(if: $withFuelType)
    owner @include(if: $withOwner) {
      id
      displayName
      avatarUrl
    }
    deletedAt @include(if: $withDeletedAt)
  }
  trashCount
  trashDeletableCount
}

# What the vehicle page shows of the vehicle; the offline download asks for the same, so its answer stands in for this query offline.
fragment VehicleDetailsFields on Vehicle {
  id
  name
  licensePlate
  fuelType
  pictureUrl
  canEdit
  logAccess
  refuelingCount
  units {
    distance
    volume
  }
  owner {
    id
    displayName
    avatarUrl
  }
}

# Everything the vehicle page needs in one request. Also loaded when the edit dialog opens: the grid may not
# have fetched every field (columns can be hidden), so edits never start from grid rows.
query VehicleDetails($id: UUID!) {
  vehicle(id: $id) {
    ...VehicleDetailsFields
  }
}

query VehicleDefaults {
  vehicleDefaults {
    distanceUnit
    volumeUnit
    currency
    recurringWarnDays
    recurringWarnDistance
  }
}

mutation AddVehicle($input: AddVehicleInput!) {
  addVehicle(input: $input) {
    id
  }
}

mutation UpdateVehicle($input: UpdateVehicleInput!) {
  updateVehicle(input: $input) {
    id
  }
}

mutation DeleteVehicle($id: UUID!) {
  deleteVehicle(id: $id) {
    id
  }
}

mutation RestoreVehicle($id: UUID!) {
  restoreVehicle(id: $id) {
    id
  }
}

mutation EmptyTrash {
  emptyTrash
}
