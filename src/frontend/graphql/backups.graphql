# The administration's Backups page. `run` is polled while a backup is being written (BackupRun selects only what costs nothing).

# What a restore needs of a restore point (its confirmation and the wait for the restart), on the Backups page and the setup page alike.
fragment RestoreTargetFields on RestorePointInfo {
  file
  createdAt
  appVersion
  encrypted
  olderMigration
  # what it brings of its server's settings, and what this server would lack (its restore is refused until they are set)
  settingsFile {
    state
    secrets
    secretsLeftOut
  }
  environment {
    mode
    settings
    missing
    missingCertain
    overridden
  }
}

fragment BackupRunFields on BackupRunInfo {
  running
  startedAt
  finishedAt
  file
  bytes
  error
}

query Backups {
  backups {
    folder
    migration
    run {
      ...BackupRunFields
    }
    settings {
      recipient
      photosApart
      photos
      maxUploadMb
      times
      days
      timeZone
      nextRun
      keep
      keepDays
      environment
      secrets
    }
    sizes {
      database
      pictures
      photos
    }
    restorePoints {
      ...RestoreTargetFields
      bytes
      provider
      migration
      sameMigration
      safetyNet
      uploaded
      recipient
      currentRecipient
      photos
      keys
      rows
    }
  }
}

query BackupRun {
  backups {
    run {
      ...BackupRunFields
    }
  }
}

mutation RunBackup {
  runBackup
}

mutation PrepareBackupEncryption($passphrase: String) {
  prepareBackupEncryption(passphrase: $passphrase) {
    passphrase
    generated
    identity
    recipient
    salt
  }
}

mutation RestoreBackup($input: RestoreBackupInput!) {
  restoreBackup(input: $input) {
    file
    restorePoint
  }
}

mutation DeleteBackup($file: String!) {
  deleteBackup(file: $file)
}
