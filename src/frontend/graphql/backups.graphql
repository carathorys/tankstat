# The administration's Backups page. `run` is polled while a backup is being written (BackupRun selects only what costs nothing).

# What a restore needs of a restore point (its confirmation and the wait for the restart), on the Backups page and the setup page alike.
fragment RestoreTargetFields on RestorePointInfo {
  file
  createdAt
  appVersion
  encrypted
  olderMigration
  # held: retention never removes it, and it is not deleted until released
  held
  heldSince
  # what it brings of its server's settings, and what this server would lack (its restore is refused until they are set)
  settingsFile {
    state
    secrets
    secretsLeftOut
  }
  environment {
    mode
    settings
    missing
    missingCertain
    logLevelsMissing
    overridden
  }
}

fragment BackupRunFields on BackupRunInfo {
  running
  startedAt
  finishedAt
  file
  bytes
  error
}

query Backups {
  backups {
    folder
    migration
    run {
      ...BackupRunFields
    }
    settings {
      recipient
      photosApart
      photos
      maxUploadMb
      times
      days
      timeZone
      nextRun
      keep
      keepDays
      environment
      secrets
    }
    sizes {
      database
      pictures
      photos
    }
    restorePoints {
      ...RestoreTargetFields
      bytes
      provider
      migration
      sameMigration
      safetyNet
      uploaded
      recipient
      currentRecipient
      photos
      keys
      rows
    }
  }
}

query BackupRun {
  backups {
    run {
      ...BackupRunFields
    }
  }
}

mutation RunBackup {
  runBackup
}

mutation PrepareBackupEncryption($passphrase: String) {
  prepareBackupEncryption(passphrase: $passphrase) {
    passphrase
    generated
    identity
    recipient
    salt
  }
}

mutation RestoreBackup($input: RestoreBackupInput!) {
  restoreBackup(input: $input) {
    file
    restorePoint
  }
}

mutation DeleteBackup($file: String!) {
  deleteBackup(file: $file)
}

mutation HoldBackup($file: String!, $hold: Boolean!) {
  holdBackup(file: $file, hold: $hold)
}

# A backup opened: what its plain manifest says, asked for when its dialog opens (the setup page asks the same with its code).
fragment BackupDetailsFields on BackupDetailsInfo {
  file
  bytes
  held
  heldSince
  format
  writtenBy
  createdAt
  appVersion
  provider
  migration
  safetyNet
  uploaded
  encrypted
  recipient
  currentRecipient
  encryptionMethod
  pictures
  photos
  keys
  tables {
    name
    rows
  }
  sizes {
    tables
    pictures
    photos
    keys
    archive
  }
  archiveEntry
  sha256
  settingsFile {
    state
    bytes
    secrets
    secretsLeftOut
    machineLeftOut
  }
  environment {
    mode
    settings
    server
  }
}

query BackupDetails($file: String!) {
  backupDetails(file: $file) {
    ...BackupDetailsFields
  }
}
