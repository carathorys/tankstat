# The administration's Backups page. `run` is polled while a backup is being written (BackupRun selects only what costs nothing).

fragment BackupRunFields on BackupRunInfo {
  running
  startedAt
  finishedAt
  file
  bytes
  error
}

query Backups {
  backups {
    folder
    migration
    run {
      ...BackupRunFields
    }
    settings {
      recipient
      photosApart
      photos
      maxUploadMb
      every
      nextRun
      keep
      keepDays
    }
    sizes {
      database
      pictures
      photos
    }
    restorePoints {
      file
      bytes
      createdAt
      appVersion
      provider
      migration
      sameMigration
      safetyNet
      uploaded
      encrypted
      recipient
      currentRecipient
      photos
      keys
      rows
    }
  }
}

query BackupRun {
  backups {
    run {
      ...BackupRunFields
    }
  }
}

mutation RunBackup {
  runBackup
}

mutation PrepareBackupEncryption($passphrase: String) {
  prepareBackupEncryption(passphrase: $passphrase) {
    passphrase
    generated
    identity
    recipient
    salt
  }
}

mutation RestoreBackup($input: RestoreBackupInput!) {
  restoreBackup(input: $input) {
    file
    restorePoint
  }
}

mutation DeleteBackup($file: String!) {
  deleteBackup(file: $file)
}
