name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the release workflow run the very same checks before it builds an image, and stamp the build with its version.
  workflow_call:
    inputs:
      version:
        description: The version the build job publishes the API as (empty = 0.0.0-dev.<sha>)
        type: string
        default: ""

permissions:
  contents: read

# A newer push to the same branch/PR makes the older, still running, run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  # Lint, types and the production build of the web app. The build (dist/) is handed to the build job, so it is made once; so is the
  # version both are stamped with (the web app shows its own in the footer, next to the API's).
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Installs the versions pinned in mise.toml (the same ones developers use); only Node is needed here.
      - uses: jdx/mise-action@v2
        with:
          install_args: node
          cache: true
      - uses: ./.github/actions/node-modules

      - run: npm run lint
      - run: npm run typecheck
      - name: Work out the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: echo "version=${REQUESTED:-0.0.0-dev.${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"

      # `vite build` only: `npm run build` would type-check again.
      - run: npx vite build
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  # The Vitest suite (unit + integration, with coverage) in three parallel shards: a file's tests run one after another and the
  # integration tests are CPU-bound, so splitting the files over three machines cuts the wall time to about a third. Codecov merges the
  # three uploads of the same commit and flag.
  frontend-tests:
    name: frontend tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # report every failing shard, not just the first
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install_args: node
          cache: true
      - uses: ./.github/actions/node-modules

      - name: Tests with coverage
        run: npx vitest run --coverage --shard=${{ matrix.shard }}/3 && npm run coverage:paths

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/frontend/lcov.info
          flags: frontend
          # A missing token (no secret yet, or a fork) must not break the build; the status checks come from Codecov itself.
          fail_ci_if_error: false

  # Everything that needs only .NET: build, unit tests, in-process integration tests.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install_args: dotnet
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore Tankstat.slnx
      - run: dotnet build Tankstat.slnx --no-restore

      # The test projects run side by side (built once above), the integration tests in three processes (they run one after another
      # within one); each run's output is printed, folded, once it is done.
      - name: Unit and integration tests
        run: scripts/test-backend.sh

      - name: Upload backend coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: test-results
          flags: backend
          fail_ci_if_error: false

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            test-results
            test-logs
          retention-days: 7

  # Runs the real app as a process: once per authentication mode (startup smoke tests), and the black-box GraphQL
  # contract tests against a freshly started server. Slower, so it runs next to the others rather than after them.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install_args: dotnet
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Startup smoke tests (None, Standalone, OIDC, ProxyHeader, bad settings)
        run: mise run test:smoke

      - name: API contract tests against a running server
        run: mise run test:api

  # schema.graphql and the generated TypeScript GraphQL types must match the API and the .graphql documents.
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: ./.github/actions/node-modules

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: mise run codegen:check

  # The self-hostable build (API + web app in wwwroot), published once: kept as an artifact for pull requests and main, and the
  # release workflow makes its image from it. It does not wait for the tests (only for the web app's build); the release waits for
  # this whole workflow before it publishes anything.
  build:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install_args: dotnet
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Publish the API with the web app
        env:
          VERSION: ${{ needs.frontend.outputs.version }}
        run: mise run build:api

      - uses: actions/upload-artifact@v4
        with:
          name: tankstat-${{ github.sha }}
          path: out
          if-no-files-found: error
          retention-days: 14
