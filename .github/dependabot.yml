# Dependency updates, once a week, grouped so a routine week is at most one pull request per ecosystem (minor and patch
# versions together); a major version comes on its own. CI runs on each, like on any pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /src/frontend/tankstat-react
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
