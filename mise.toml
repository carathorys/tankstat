[tools]
node = "lts"
dotnet = "10"

[tasks.install]
description = "Install web dependencies and restore .NET packages"
run = ["npm ci --prefix src/frontend/tankstat-react", "dotnet restore"]

[tasks."dev:api"]
description = "Run the API with hot reload on :5080"
# Run from the project directory: `dotnet watch --project` from the repo root mis-resolves
# obj\Debug\... (staticwebassets.development.json) on Linux.
dir = "src/backend/Tankstat.Api"
run = "dotnet watch run"

[tasks."dev:web"]
description = "Run the Vite dev server (proxies /graphql, /auth/oidc/, /media and /imports to :5080)"
dir = "src/frontend/tankstat-react"
run = "npm run dev"

[tasks."db:migration"]
description = "Add an EF Core migration to every provider: mise run db:migration <Name>"
usage = 'arg "<name>" help="Migration name, e.g. AddFuelStation"'
run = '''
for p in Sqlite PostgreSql SqlServer MySql; do
  dotnet ef migrations add "${usage_name}" --project "src/backend/Tankstat.Migrations.$p" --output-dir . --namespace "Tankstat.Migrations.$p"
done
'''

[tasks.seed]
description = "Test data (auth mode None only): deletes the dev database, recreates, migrates and seeds it. Options after --, e.g. mise run seed -- --vehicles 200 --trashed 20 --refuelings 5-40 (see --help)"
# The default target is the database `mise run dev:api` uses; a later --connection overrides it.
run = 'dotnet run --project src/backend/Tankstat.Seeder -- --connection "Data Source=$PWD/src/backend/Tankstat.Api/tankstat.db" --uploads "$PWD/src/backend/Tankstat.Api/uploads" --settings "$PWD/src/backend/Tankstat.Api/settings.json"'

[tasks."docker:build"]
description = "Build the single-container image (API + web app) as tankstat:local"
run = "docker build -t tankstat:local --build-arg REVISION=$(git rev-parse --short HEAD) ."

[tasks."docker:smoke"]
description = "Run the image built by docker:build and check it serves the web app and the API"
run = "scripts/docker-smoke.sh tankstat:local"

[tasks."schema:export"]
description = "Export the GraphQL schema from the API to schema.graphql (no server is started)"
run = 'dotnet run --project src/backend/Tankstat.Api --no-launch-profile -- schema export --output "$PWD/schema.graphql"'

[tasks.codegen]
description = "Regenerate schema.graphql and the TypeScript GraphQL types/documents (src/frontend/tankstat-react/src/gql/generated.ts)"
run = ["mise run schema:export", "npm --prefix src/frontend/tankstat-react run codegen"]

[tasks."codegen:check"]
description = "Fail if schema.graphql or the generated GraphQL types are out of date"
run = "scripts/check-codegen.sh"

[tasks.lint]
dir = "src/frontend/tankstat-react"
run = "npm run lint"

[tasks.build]
description = "Produce a self-hostable build in ./out (API + SPA in wwwroot; VERSION=1.2.3 sets the version of both)"
run = [
  "npm --prefix src/frontend/tankstat-react run build",
  "mise run build:api",
]

# CI's build job runs this on the SPA the frontend job built, and the release image is made from its ./out (Dockerfile, target release).
[tasks."build:api"]
description = "Publish the API into ./out (framework-dependent, every platform; VERSION=1.2.3 sets its version; the SPA gets its own from vite build) and put the web app's build (src/frontend/tankstat-react/dist) in wwwroot"
run = [
  'dotnet publish src/backend/Tankstat.Api -c Release -o out -p:UseAppHost=false ${VERSION:+-p:Version=$VERSION}',
  "rm -rf out/wwwroot && cp -r src/frontend/tankstat-react/dist out/wwwroot",
]

[tasks."test:unit"]
description = "Unit tests (web + API)"
run = ["npm --prefix src/frontend/tankstat-react run test:unit", "dotnet test tests/backend/Tankstat.Seeder.UnitTests", "dotnet test tests/backend/Tankstat.Domain.UnitTests", "dotnet test tests/backend/Tankstat.Application.UnitTests", "dotnet test tests/backend/Tankstat.Infrastructure.UnitTests"]

[tasks."test:integration"]
description = "Integration tests (web with mocked HTTP + API in-process)"
run = ["npm --prefix src/frontend/tankstat-react run test:integration", "dotnet test tests/backend/Tankstat.Api.IntegrationTests"]

[tasks."test:smoke"]
description = "Start the real app as a process in every authentication mode (and with bad settings) and check it comes up"
run = "dotnet test tests/backend/Tankstat.Api.SmokeTests"

[tasks."test:api"]
description = "Black-box API contract tests against a freshly started server"
run = "scripts/test-api.sh"

[tasks."test:e2e"]
description = "Real-browser tests (Playwright, src/frontend/tankstat-react/e2e) against a fresh build in ./out, at phone and desktop size; Playwright's options after --, e.g. mise run test:e2e -- --project phone. Not part of mise run test"
run = ["mise run build", "scripts/test-e2e.sh"]

[tasks.screenshots]
description = "The README's screenshots (docs/screenshots) from a fresh build in ./out with the seeder's data, at phone and desktop size, dark and light; Playwright's options after --, e.g. mise run screenshots -- --project desktop-dark. The footer shows VERSION, else the latest tag's"
# The footer is in the desktop pictures: the latest tag's version unless VERSION says otherwise, never 0.0.0-dev.
run = [
  "VERSION=\"${VERSION:-$(git describe --tags --abbrev=0 | sed 's/^v//')}\" mise run build",
  "scripts/screenshots.sh",
]

[tasks."test:durations"]
description = "Measure how long each frontend test file takes into src/frontend/tankstat-react/tests/durations.json (CI balances its shards by it); rerun when files were added or got much slower"
dir = "src/frontend/tankstat-react"
run = [
  # The report's path is from Vitest's root (src/frontend/tankstat-react/src). On a small machine add -- --maxWorkers=4 to the vitest line by hand.
  "npx vitest run --coverage --reporter=json --outputFile=../../../../coverage/vitest-report.json",
  "node scripts/durations.mjs ../../../coverage/vitest-report.json",
]

[tasks."test:coverage"]
description = "Unit + integration tests with coverage reports in ./coverage (frontend/index.html, backend/*/*/coverage.cobertura.xml)"
run = """
rm -rf coverage
npm --prefix src/frontend/tankstat-react run test:coverage
for project in tests/backend/*.UnitTests tests/backend/Tankstat.Api.IntegrationTests; do
  dotnet test "$project" --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory "coverage/backend/$(basename "$project")"
done
"""

[tasks.test]
description = "Everything: typecheck, lint, unit, integration, API"
depends = ["lint"]
run = ["mise run codegen:check", "npm --prefix src/frontend/tankstat-react run typecheck", "mise run test:unit", "mise run test:integration", "mise run test:smoke", "mise run test:api"]
