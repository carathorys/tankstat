[tools]
node = "lts"
dotnet = "10"

[tasks.install]
description = "Install web dependencies and restore .NET packages"
run = ["npm ci", "dotnet restore"]

[tasks."dev:api"]
description = "Run the API with hot reload on :5080"
# Run from the project directory: `dotnet watch --project` from the repo root mis-resolves
# obj\Debug\... (staticwebassets.development.json) on Linux.
dir = "src/backend/Tankstat.Api"
run = "dotnet watch run"

[tasks."dev:reader"]
description = "Run the optional photo reader with hot reload on :5090 (API key: dev; needs tesseract installed)"
dir = "src/backend/Tankstat.Reader"
env = { Reader__ApiKey = "dev", ASPNETCORE_URLS = "http://localhost:5090" }
run = "dotnet watch run --no-launch-profile"

[tasks."dev:web"]
description = "Run the Vite dev server (proxies /graphql to :5080)"
run = "npm run dev"

[tasks."db:migration"]
description = "Add an EF Core migration to every provider: mise run db:migration <Name>"
usage = 'arg "<name>" help="Migration name, e.g. AddFuelStation"'
run = '''
for p in Sqlite PostgreSql SqlServer MySql; do
  dotnet ef migrations add "${usage_name}" --project "src/backend/Tankstat.Migrations.$p" --output-dir . --namespace "Tankstat.Migrations.$p"
done
'''

[tasks.seed]
description = "Test data (auth mode None only): deletes the dev database, recreates, migrates and seeds it. Options after --, e.g. mise run seed -- --vehicles 200 --trashed 20 --refuelings 5-40 (see --help)"
# The default target is the database `mise run dev:api` uses; a later --connection overrides it.
run = 'dotnet run --project src/backend/Tankstat.Seeder -- --connection "Data Source=$PWD/src/backend/Tankstat.Api/tankstat.db" --uploads "$PWD/src/backend/Tankstat.Api/uploads"'

[tasks."docker:build"]
description = "Build the single-container image (API + web app) as tankstat:local"
run = "docker build -t tankstat:local --build-arg REVISION=$(git rev-parse --short HEAD) ."

[tasks."docker:smoke"]
description = "Run the image built by docker:build and check it serves the web app and the API"
run = "scripts/docker-smoke.sh tankstat:local"

[tasks."docker:build:reader"]
description = "Build the optional photo reader image as tankstat-reader:local"
run = "docker build -f Dockerfile.reader -t tankstat-reader:local --build-arg REVISION=$(git rev-parse --short HEAD) ."

[tasks."docker:smoke:reader"]
description = "Run the image built by docker:build:reader and check it is healthy, guards its API key and reads a receipt"
run = "scripts/docker-smoke-reader.sh tankstat-reader:local"

[tasks."reader:eval"]
description = "Measure the photo reader: mise run reader:eval -- <folder> or -- --synthetic 60 (options: --edge, --tessdata, --verbose, --json)"
run = "dotnet run --project src/backend/Tankstat.Reader --no-launch-profile -- --eval"

[tasks."reader:synth"]
description = "Write generated photos with their expected values: mise run reader:synth -- <folder> [--count 30] [--seed 1] [--kind odometer]"
run = "dotnet run --project src/backend/Tankstat.Reader --no-launch-profile -- --synth"

[tasks."schema:export"]
description = "Export the GraphQL schema from the API to schema.graphql (no server is started)"
run = 'dotnet run --project src/backend/Tankstat.Api --no-launch-profile -- schema export --output "$PWD/schema.graphql"'

[tasks.codegen]
description = "Regenerate schema.graphql and the TypeScript GraphQL types/documents (src/frontend/gql/generated.ts)"
run = ["mise run schema:export", "npm run codegen"]

[tasks."codegen:check"]
description = "Fail if schema.graphql or the generated GraphQL types are out of date"
run = "scripts/check-codegen.sh"

[tasks.lint]
run = "npm run lint"

[tasks.build]
description = "Produce a self-hostable build in ./out (API + SPA in wwwroot)"
run = [
  "npm run build",
  "dotnet publish src/backend/Tankstat.Api -c Release -o out",
  "rm -rf out/wwwroot && cp -r dist out/wwwroot",
]

[tasks."test:unit"]
description = "Unit tests (web + API)"
run = ["npm run test:unit", "dotnet test tests/backend/Tankstat.Seeder.UnitTests", "dotnet test tests/backend/Tankstat.Domain.UnitTests", "dotnet test tests/backend/Tankstat.Application.UnitTests", "dotnet test tests/backend/Tankstat.Infrastructure.UnitTests", "dotnet test tests/backend/Tankstat.Reader.Core.UnitTests"]

[tasks."test:integration"]
description = "Integration tests (web with mocked HTTP + API in-process)"
run = ["npm run test:integration", "dotnet test tests/backend/Tankstat.Api.IntegrationTests", "dotnet test tests/backend/Tankstat.Reader.IntegrationTests"]

[tasks."test:reader"]
description = "Photo reader tests (unit + integration; the real-Tesseract ones are skipped where tesseract is not installed)"
run = ["dotnet test tests/backend/Tankstat.Reader.Core.UnitTests", "dotnet test tests/backend/Tankstat.Reader.IntegrationTests"]

[tasks."test:smoke"]
description = "Start the real app as a process in every authentication mode (and with bad settings) and check it comes up"
run = "dotnet test tests/backend/Tankstat.Api.SmokeTests"

[tasks."test:api"]
description = "Black-box API contract tests against a freshly started server"
run = "scripts/test-api.sh"

[tasks."test:coverage"]
description = "Unit + integration tests with coverage reports in ./coverage (frontend/index.html, backend/*/*/coverage.cobertura.xml)"
run = """
rm -rf coverage
npm run test:coverage
for project in tests/backend/*.UnitTests tests/backend/Tankstat.Api.IntegrationTests tests/backend/Tankstat.Reader.IntegrationTests; do
  dotnet test "$project" --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory "coverage/backend/$(basename "$project")"
done
"""

[tasks.test]
description = "Everything: typecheck, lint, unit, integration, API"
depends = ["lint"]
run = ["mise run codegen:check", "npm run typecheck", "mise run test:unit", "mise run test:integration", "mise run test:smoke", "mise run test:api"]
